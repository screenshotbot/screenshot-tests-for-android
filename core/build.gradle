apply plugin: 'com.android.library'
apply plugin: 'com.vanniktech.maven.publish'

group = GROUP

android {
  namespace 'com.facebook.testing.screenshot'
  compileSdkVersion versions.compileSdk

  packagingOptions {
    exclude 'LICENSE.txt'
  }

  defaultConfig {
    minSdkVersion versions.minSdk
    targetSdkVersion versions.targetSdk
    testInstrumentationRunner "com.facebook.testing.screenshot.CustomScreenshotTestRunner"
    multiDexEnabled true
  }

  lintOptions {
    abortOnError false
    disable 'InvalidPackage'
  }

    
}

tasks.whenTaskAdded {
  if (it.name == "androidJavadoc") {
    it.configure {
      exclude '**/BUCK'
    }
  }
}

dependencies {
  implementation 'androidx.test:monitor:1.8.0'
  compileOnly deps.jsr305
  compileOnly deps.inferAnnotations

  implementation deps.supportAppCompat
  implementation deps.gson
  implementation deps.guava

  androidTestImplementation deps.dexmaker
  androidTestImplementation deps.dexmakerDx
  androidTestImplementation deps.junit
  androidTestImplementation deps.androidTestRules
  androidTestImplementation deps.espresso
  androidTestImplementation deps.mockito
  androidTestImplementation deps.dexmakerMockito
  androidTestImplementation deps.hamcrest
  androidTestImplementation deps.assertjCore
  androidTestImplementation deps.supportMultidex
}

// Maven Central publishing configuration
mavenPublishing {
  // Only configure Maven Central publishing and signing for release builds
  // For local builds (CI, development), skip this to avoid signing requirements
  if (project.hasProperty('signing.gnupg.keyName')) {
    publishToMavenCentral("CENTRAL_PORTAL")
    signAllPublications()
  }

  coordinates(GROUP, POM_ARTIFACT_ID, VERSION_NAME)

  // Configure to publish debug variant for test libraries
  configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary("debug", true, true))

  pom {
    name = POM_NAME
    description = POM_DESCRIPTION
    url = POM_URL

    licenses {
      license {
        name = POM_LICENCE_NAME
        url = POM_LICENCE_URL
        distribution = POM_LICENCE_DIST
      }
    }

    developers {
      developer {
        id = POM_DEVELOPER_ID
        name = POM_DEVELOPER_NAME
      }
    }

    scm {
      connection = POM_SCM_CONNECTION
      developerConnection = POM_SCM_DEV_CONNECTION
      url = POM_SCM_URL
    }
  }
}

// Configure GPG signing
afterEvaluate {
  if (project.hasProperty('signing.gnupg.keyName')) {
    signing {
      useGpgCmd()
    }
  }
}
