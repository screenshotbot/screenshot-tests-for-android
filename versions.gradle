ext {
  final screenshotTestVersion = VERSION_NAME
  final dexmakerVersion = "2.28.3"
  final lithoVersion = "0.44.0"

  versions = [
      kotlin    : '2.3.0',
      targetSdk : 33,
      compileSdk: 35,
      minSdk    : 21,
  ]

  plugs = [
      agp        : "com.android.tools.build:gradle:8.0.2",
      screenshot : "io.screenshotbot.screenshot-tests-for-android:plugin:$screenshotTestVersion",
      kotlin     : "org.jetbrains.kotlin:kotlin-gradle-plugin:${versions.kotlin}",
      versions   : 'com.github.ben-manes:gradle-versions-plugin:0.51.0',
      publish    : 'com.vanniktech:gradle-maven-publish-plugin:0.30.0',
      dokka      : 'org.jetbrains.dokka:dokka-gradle-plugin:1.9.20'
  ]

  deps = [
      supportAppCompat    : "androidx.appcompat:appcompat:1.7.0",
      supportDesign       : "com.google.android.material:material:1.12.0",
      supportMultidex     : "androidx.multidex:multidex:2.0.1",

      kotlinStdlib        : "org.jetbrains.kotlin:kotlin-stdlib-jdk7:${versions.kotlin}",

      gson                : "com.google.code.gson:gson:2.11.0",

      jsr305              : "com.google.code.findbugs:jsr305:3.0.2",
      guava               : "com.google.guava:guava:33.2.1-android",
      inferAnnotations    : "com.facebook.infer.annotation:infer-annotation:0.18.0",

      dexmaker            : "com.linkedin.dexmaker:dexmaker:$dexmakerVersion",
      dexmakerMockito     : "com.linkedin.dexmaker:dexmaker-mockito:$dexmakerVersion",

      espresso            : "androidx.test.espresso:espresso-core:3.6.1",
      testRunner          : "androidx.test:runner:1.6.1",
      orchestrator        : "androidx.test:orchestrator:1.5.0",
      androidTestRules    : "androidx.test:rules:1.6.1",
      junit               : "junit:junit:4.13.2",
      mockito             : "org.mockito:mockito-core:5.12.0",
      hamcrest            : "org.hamcrest:hamcrest-core:1.3",
      assertjCore         : "org.assertj:assertj-core:3.26.0",
      commonsCompress     : "org.apache.commons:commons-compress:1.26.2",

      hiddenApiBypass     : "org.lsposed.hiddenapibypass:hiddenapibypass:6.1"
  ]
}
