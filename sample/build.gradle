buildscript {
  apply from: rootProject.file('versions.gradle')
  repositories {
    mavenLocal()
    mavenCentral()
    google()
    gradlePluginPortal()    
  }

  dependencies {
    classpath 'com.android.tools.build:gradle:8.9.1'
    classpath plugs.screenshot
    classpath plugs.kotlin
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${versions.kotlin}"
  }
}

allprojects {
  repositories {
    mavenLocal()
    mavenCentral()
    google()
  }
}

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.screenshotbot.screenshot-tests-for-android'

android {
  namespace 'com.facebook.testing.screenshot.sample'

  compileSdkVersion versions.compileSdk
  defaultConfig {
    applicationId "com.facebook.testing.screenshot.example"
    minSdkVersion 28
    targetSdkVersion versions.targetSdk
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    testInstrumentationRunnerArguments clearPackageData: 'true'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
  testOptions {
    // execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }

    buildFeatures {
        compose true
    }
}

dependencies {
  implementation deps.supportAppCompat
  implementation deps.supportDesign

  androidTestImplementation "io.screenshotbot.screenshot-tests-for-android:core:1.0.0"

  androidTestImplementation deps.junit
  androidTestImplementation deps.testRunner
  androidTestUtil deps.orchestrator
  androidTestImplementation(deps.espresso) {
    exclude group: 'com.android.support', module: 'support-annotations'
    exclude group: 'com.google.code.findbugs', module: 'jsr305'
  }
    androidTestImplementation deps.androidTestRules

    def composeBom = platform('androidx.compose:compose-bom:2026.01.00')
    implementation composeBom
    androidTestImplementation composeBom

    // Choose one of the following:
    // Material Design 3
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'

    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.foundation:foundation-layout"

    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Add window size utils
    implementation 'androidx.compose.material3.adaptive:adaptive'

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.11.0'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.5'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Optional - Integration with RxJava
    implementation 'androidx.compose.runtime:runtime-rxjava2'
}

screenshots {
    multipleDevices true
    failureDir "failureScreenshots"
    pythonExecutable 'python3'
}
