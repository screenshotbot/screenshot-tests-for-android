buildscript {
  repositories {
    mavenCentral()
    google()
    mavenLocal()
  }
  dependencies {
    classpath plugs.kotlin
    classpath plugs.dokka
  }
}

plugins {
  id 'com.gradle.plugin-publish' version '1.1.0'
}

apply plugin: 'groovy'
apply plugin: 'kotlin'
apply plugin: 'java-gradle-plugin'
apply plugin: 'maven-publish'

final GENERATED_PACKAGE_NAME = "com.facebook.testing.screenshot.generated"
final GENERATED_BUILD_DIR =
    new File(
        projectDir.absolutePath,
        "src/generated/kotlin/${GENERATED_PACKAGE_NAME.replace('.', '/')}")

task generateBuildConfig {
  final version = project.version.toString()
  doLast {
    GENERATED_BUILD_DIR.deleteDir()
    GENERATED_BUILD_DIR.mkdirs()

    final className = "ScreenshotTestBuildConfig"
    final configClass = new File(GENERATED_BUILD_DIR, "${className}.kt")
    BufferedWriter writer = configClass.newWriter()
    try {
      writer.writeLine("package $GENERATED_PACKAGE_NAME")
      writer.writeLine("object $className { val VERSION = \"${version}\" }")
      writer.flush()
    } finally {
      writer.close()
    }
  }
}

dependencies {
  implementation deps.kotlinStdlib
  implementation deps.commonsCompress
  implementation deps.gson
  compileOnly plugs.agp

  testImplementation deps.junit
  testImplementation plugs.agp
  testImplementation deps.mockito
  testImplementation deps.hamcrest
  testImplementation gradleTestKit()
  testRuntimeOnly plugs.agp
}

group = GROUP
version = VERSION_NAME

compileKotlin {
  dependsOn generateBuildConfig
  sourceSets {
    main {
      kotlin.srcDirs += 'src/generated'
    }
  }
}

compileJava {
  sourceSets {
    main {
      resources.srcDirs 'resources'            
      resources {
        exclude '**/*.pyc'
        exclude '**/test_*.py'
        exclude '**/fixtures/**'
      }
    }
  }
}

clean {
  delete GENERATED_BUILD_DIR
}

// Gradle Plugin Portal configuration
gradlePlugin {
  website = POM_URL
  vcsUrl = POM_SCM_URL
  plugins {
    screenshotTestsPlugin {
      id = 'io.screenshotbot.screenshot-tests-for-android'
      displayName = POM_NAME
      description = POM_DESCRIPTION
      implementationClass = 'com.facebook.testing.screenshot.build.ScreenshotsPlugin'
      tags = ['screenshot-testing', 'android', 'testing']
    }
  }
}

// Configure POM for Maven Central
afterEvaluate {
  publishing {
    publications {
      named("screenshotTestsPluginPluginMarkerMaven") {
        pom {
          name = POM_NAME
          description = POM_DESCRIPTION
          url = POM_URL

          licenses {
            license {
              name = POM_LICENCE_NAME
              url = POM_LICENCE_URL
              distribution = POM_LICENCE_DIST
            }
          }

          developers {
            developer {
              id = POM_DEVELOPER_ID
              name = POM_DEVELOPER_NAME
            }
          }

          scm {
            connection = POM_SCM_CONNECTION
            developerConnection = POM_SCM_DEV_CONNECTION
            url = POM_SCM_URL
          }
        }
      }
      named("pluginMaven") {
        pom {
          name = POM_NAME
          description = POM_DESCRIPTION
          url = POM_URL

          licenses {
            license {
              name = POM_LICENCE_NAME
              url = POM_LICENCE_URL
              distribution = POM_LICENCE_DIST
            }
          }

          developers {
            developer {
              id = POM_DEVELOPER_ID
              name = POM_DEVELOPER_NAME
            }
          }

          scm {
            connection = POM_SCM_CONNECTION
            developerConnection = POM_SCM_DEV_CONNECTION
            url = POM_SCM_URL
          }
        }
      }
    }
  }
}
